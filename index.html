<style>

.fx{display:none;position:fixed;inset:0;z-index:80;background:#061328e8;align-items:center;justify-content:center;text-align:center}.fx.show{display:flex}.fxcard{width:min(88%,430px);border:3px solid var(--gold);border-radius:18px;padding:22px 16px;background:radial-gradient(circle,#274c79,#09182c 70%);box-shadow:0 0 40px #ffe16c88}.fxcard h1{margin:0;color:#ffe16c;font-size:32px;animation:pop .55s}.growth{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0}.growth div{background:#0c213b;border-radius:7px;padding:7px}.newskill{color:#8fe9ff;font-weight:900}.dropTitle{color:#ffe16c}.dropItem{font-size:22px;font-weight:900}.goldTitle{color:#ffe16c;text-shadow:0 0 12px #ffdc62}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media(max-height:720px){#app{grid-template-rows:48px 35px 1fr 48px 84px 48px}.sprite{height:55px}.monster{font-size:43px}.char{transform:scale(.82);transform-origin:bottom}.btn{min-height:34px}}
</style></head><body>
<main id="app">
<header class="top"><div class="logo">⚔ DROP HUNTER <small>v0.7</small></div><div class="expMini"><div>Lv <b id="lv"></b>　EXP <span id="expTxt"></span></div><div class="bar expbar"><i id="expFill"></i></div></div><div>💰 <b id="gold"></b>G</div></header>

<script>
(()=>{"use strict";const $=s=>document.querySelector(s),KEY="dropHunter07";
const needExp=l=>Math.floor(100+20*l+15*l*l);
const skillDefs=[["強撃",2,3,"単体・威力高"],["火炎斬り",3,5,"炎属性・単体"],["ヒール",5,5,"HPを回復"],["風刃",7,8,"敵全体"],["二連斬り",10,8,"2回攻撃"],["アイス",12,10,"氷属性・高威力"],["会心斬り",15,12,"会心率大"],["奥義・紅蓮",20,20,"超威力"]];
const shop=[
{id:"bronze",n:"銅の剣",type:"武器",lv:1,g:180,atk:3,def:0,crit:0,desc:"攻撃+3"},
{id:"iron",n:"鉄の剣",type:"武器",lv:3,g:420,atk:7,def:0,crit:0,desc:"攻撃+7"},
{id:"steel",n:"鋼の剣",type:"武器",lv:6,g:850,atk:12,def:0,crit:1,desc:"攻撃+12 / 会心+1%"},
{id:"fire",n:"炎の剣",type:"武器",lv:10,g:1800,atk:18,def:0,crit:2,desc:"攻撃+18 / 炎属性"},
{id:"cloth",n:"旅人の服",type:"服",lv:1,g:120,atk:0,def:2,crit:0,desc:"防御+2"},
{id:"leather",n:"革の服",type:"服",lv:4,g:360,atk:0,def:6,crit:0,desc:"防御+6"},
{id:"chain",n:"鎖かたびら",type:"服",lv:8,g:950,atk:0,def:12,crit:0,desc:"防御+12"},
{id:"amulet",n:"小さなお守り",type:"アクセ",lv:1,g:100,atk:0,def:1,crit:1,desc:"防御+1 / 会心+1%"},
{id:"luck",n:"幸運のお守り",type:"アクセ",lv:6,g:800,atk:0,def:2,crit:1,drop:2,desc:"防御+2 / ドロップ率補正"},
{id:"magicring",n:"魔力の指輪",type:"アクセ",lv:12,g:2400,atk:5,def:2,crit:2,desc:"攻撃+5 / 防御+2"}
];
const drops={
スライム:[{n:"ぷるぷるゼリー",r:12,rar:"NORMAL"},{n:"スライムピアス",r:120,rar:"RARE",type:"アクセ",atk:0,def:2,crit:2}],
ゴブリン:[{n:"ゴブリンの牙",r:15,rar:"NORMAL"},{n:"盗賊の短剣",r:150,rar:"RARE",type:"武器",atk:14,def:0,crit:5}],
オオカミ:[{n:"狼の毛皮",r:18,rar:"NORMAL"},{n:"月狼の服",r:220,rar:"EPIC",type:"服",atk:0,def:16,crit:2}]
};
let S={lv:1,exp:0,gold:500,battle:1,herb:5,auto:false,hp:[70,52,60],max:[70,52,60],mp:[18,30,22],mpmax:[18,30,22],baseAtk:12,baseDef:3,guard:false,kills:{スライム:0,ゴブリン:0,オオカミ:0,"黄金スライム":0},seen:{},owned:["木の剣","旅人の服","小さなお守り"],equipment:{武器:"木の剣",服:"旅人の服",アクセ:"小さなお守り"},companions:["ミア","モフ"],drops:{},golden:false};
try{let x=JSON.parse(localStorage.getItem(KEY));if(x)S={...S,...x}}catch(e){}
let E=[],target=0,timer=null,busy=false,shopTab="武器";
function item(n){return shop.find(x=>x.n===n)||Object.values(drops).flat().find(x=>x.n===n)||({n,atk:n==="木の剣"?1:0,def:n==="旅人の服"?2:n==="小さなお守り"?1:0,crit:0})}
function stats(){let its=Object.values(S.equipment).map(item);return{atk:S.baseAtk+(S.lv-1)*3+its.reduce((a,x)=>a+(x.atk||0),0),def:S.baseDef+(S.lv-1)*2+its.reduce((a,x)=>a+(x.def||0),0),crit:5+its.reduce((a,x)=>a+(x.crit||0),0)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const mons=[["スライム","💧",30,8,14],["ゴブリン","👺",42,11,19],["オオカミ","🐺",36,10,17]];
function spawn(){busy=false;let golden=Math.random()<1/120;E=[];if(golden){let mx=90+S.lv*9;E=[{name:"黄金スライム",base:"スライム",icon:"💧",hp:mx,max:mx,atk:13+S.lv,xp:120+S.lv*10,charge:false,golden:true}];S.seen["黄金スライム"]=true;showLog("✨ 幻の気配…黄金スライムが現れた！",1400)}else{let n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){let m=mons[Math.floor(Math.random()*mons.length)],mx=m[2]+S.lv*4;E.push({name:m[0],base:m[0],icon:m[1],hp:mx,max:mx,atk:m[3]+S.lv,xp:m[4]+S.lv*2,charge:false}) ;S.seen[m[0]]=true}}target=0;render()}
function render(){let req=needExp(S.lv);$("#lv").textContent=S.lv;$("#gold").textContent=S.gold;$("#battleNo").textContent=S.battle;$("#expTxt").textContent=`${S.exp} / ${req}`;$("#expFill").style.width=Math.min(100,S.exp/req*100)+"%";$("#auto").textContent=S.auto?"AUTO ON":"AUTO OFF";$("#auto").classList.toggle("on",S.auto);
$("#enemies").innerHTML=E.map((e,i)=>`<div class="enemy ${e.hp<=0?"dead":""} ${i===target?"selected":""}" data-i="${i}"><div class="ebox">${e.charge?"⚠ 強攻撃準備<br>":""}${e.name} Lv${S.lv}<div class="bar mini hp"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div></div><div class="sprite"><div class="monster ${e.golden?"golden":""}">${e.icon}</div></div><div class="target">${i===target&&e.hp>0?"▲ TARGET":""}</div></div>`).join("");
document.querySelectorAll(".enemy").forEach(el=>el.onclick=()=>{let i=+el.dataset.i;if(E[i].hp>0){target=i;render()}});
$("#party").innerHTML=["のり","ミア","モフ"].map((n,i)=>`<div class="pcard">${n} HP ${S.hp[i]}/${S.max[i]}<div class="bar hp"><i style="width:${S.hp[i]/S.max[i]*100}%"></i></div><div class="bar mp"><i style="width:${S.mp[i]/S.mpmax[i]*100}%"></i></div>MP ${S.mp[i]}/${S.mpmax[i]}</div>`).join("");save()}
function living(){return E.filter(e=>e.hp>0)}function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(x._t);x._t=setTimeout(()=>x.style.display="none",1200)}
function showLog(t,ms=800){let x=$("#log");x.textContent=t;x.classList.add("show");clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("show"),ms)}
function floatText(t,xpct,ypct,cls=""){let d=document.createElement("div");d.className="float "+cls;d.textContent=t;d.style.left=xpct+"%";d.style.top=ypct+"%";$("#battle").appendChild(d);setTimeout(()=>d.remove(),800)}
function hit(i,d,crit=false){if(!E[i]||E[i].hp<=0)return;E[i].hp=Math.max(0,E[i].hp-d);floatText((crit?"CRITICAL! ":"")+"-"+d,12+i*31,29,crit?"crit":"")}
function enemyTurn(){living().forEach((e,j)=>{if(e.charge){let i=Math.floor(Math.random()*3),raw=e.atk*2,d=Math.max(1,raw-stats().def);if(S.guard)d=Math.max(1,Math.floor(d*.35));S.hp[i]=Math.max(1,S.hp[i]-d);e.charge=false;showLog(`${e.name}の強攻撃！ ${["のり","ミア","モフ"][i]}に${d}ダメージ`);floatText("-"+d,18+i*31,72)}else if(Math.random()<.2){e.charge=true;showLog(`⚠ ${e.name}が力を溜めている！ 次は強攻撃`)}else{let i=Math.floor(Math.random()*3),d=Math.max(1,e.atk-stats().def);if(S.guard)d=Math.max(1,Math.floor(d*.35));S.hp[i]=Math.max(1,S.hp[i]-d);showLog(`${e.name}の攻撃！ ${["のり","ミア","モフ"][i]}に${d}ダメージ`);floatText("-"+d,18+i*31,72)}});S.guard=false}
function rollDrops(e){if(e.golden){showDrop("幻の金冠", "PHANTOM");if(!S.companions.includes("黄金スライム")){S.companions.push("黄金スライム");setTimeout(()=>showFx(`<h1 class="goldTitle">NEW COMPANION!</h1><div class="dropItem">✨ 黄金スライムが仲間になった！</div><p class="small">初回撃破ボーナス</p>`),900)}return}
for(let d of (drops[e.base]||[])){let bonus=(S.equipment.アクセ==="幸運のお守り"?1.35:1);if(Math.random()<bonus/d.r){S.owned.push(d.n);S.drops[d.n]=(S.drops[d.n]||0)+1;if(d.rar!=="NORMAL")setTimeout(()=>showDrop(d.n,d.rar),350);else toast(`${d.n}を手に入れた！`)}}}
function showDrop(n,rar){showFx(`<h1 class="dropTitle">${rar==="PHANTOM"?"PHANTOM":"RARE"} DROP!</h1><div class="dropItem">${n}</div><p class="${rar==="EPIC"?"epic":rar==="PHANTOM"?"phantom":"rare"}">${rar}</p><p class="small">タップして続ける</p>`)}
function addExp(x){S.exp+=x;let req=needExp(S.lv);if(S.exp>=req){S.exp-=req;let old=S.lv,oldSt=stats(),oldMax=S.max[0],oldMp=S.mpmax[0];S.lv++;S.max=S.max.map((v,i)=>v+[6,4,5][i]);S.mpmax=S.mpmax.map((v,i)=>v+[2,3,2][i]);S.hp=[...S.max];S.mp=[...S.mpmax];let ns=stats();showFx(`<div>✦　✧　✦</div><h1>LEVEL UP!</h1><h2>Lv.${old} → Lv.${S.lv}</h2><div class="growth"><div>HP<br><b>${oldMax} → ${S.max[0]}</b></div><div>MP<br><b>${oldMp} → ${S.mpmax[0]}</b></div><div>攻撃力<br><b>${oldSt.atk} → ${ns.atk}</b></div><div>防御力<br><b>${oldSt.def} → ${ns.def}</b></div></div>${skillDefs.find(s=>s[1]===S.lv)?`<div class="newskill">NEW SKILL! 「${skillDefs.find(s=>s[1]===S.lv)[0]}」を覚えた！</div>`:""}<p class="small">タップして続ける</p>`) }}
function finish(){if(living().length)return false;let xp=E.reduce((a,e)=>a+e.xp,0),g=8+E.length*7+Math.floor(Math.random()*10)+(E.some(e=>e.golden)?250:0);E.forEach(e=>{S.kills[e.name]=(S.kills[e.name]||0)+1;rollDrops(e)});S.gold+=g;showLog(`勝利！ EXP +${xp} / +${g}G`,1000);addExp(xp);S.battle++;setTimeout(spawn,650);return true}
function end(){if(finish())return;let idx=E.findIndex(e=>e.hp>0);if(idx>=0)target=idx;enemyTurn();render()}
function attack(){if(busy)return;let st=stats(),crit=Math.random()<st.crit/100,d=Math.floor(st.atk*(.85+Math.random()*.3)*(crit?1.8:1));showLog("のりの攻撃！");hit(target,d,crit);end()}
$("#attack").onclick=attack;$("#guard").onclick=()=>{S.guard=true;showLog("のりは防御の構え！");enemyTurn();render()};$("#herb").onclick=()=>{if(!S.herb)return toast("薬草がない");S.herb--;let before=S.hp[0];S.hp[0]=Math.min(S.max[0],S.hp[0]+35);floatText("+"+(S.hp[0]-before),18,72,"heal");render()};
function renderSkills(){let unlocked=skillDefs.filter(s=>S.lv>=s[1]);$("#skillList").innerHTML=unlocked.map(s=>`<button class="skill" data-sk="${s[0]}"><b>${s[0]}</b><small>MP${s[2]} / ${s[3]}</small></button>`).join("")+(unlocked.length?`<div class="small">次の技：${(skillDefs.find(s=>S.lv<s[1])||["全習得"])[0]}</div>`:"");document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>useSkill(b.dataset.sk))}
$("#skillsBtn").onclick=()=>{renderSkills();$("#skillSheet").classList.add("open")};$("#skillClose").onclick=()=>$("#skillSheet").classList.remove("open");
function useSkill(n){let s=skillDefs.find(x=>x[0]===n);if(S.mp[0]<s[2])return toast("MPが足りない");S.mp[0]-=s[2];$("#skillSheet").classList.remove("open");showLog(`のりは「${n}」！`);let st=stats();if(n==="ヒール"){let b=S.hp[0];S.hp[0]=Math.min(S.max[0],S.hp[0]+45+S.lv*2);floatText("+"+(S.hp[0]-b),18,72,"heal");render();return}if(n==="風刃")E.forEach((e,i)=>hit(i,Math.floor(st.atk*1.15)));else if(n==="二連斬り"){hit(target,Math.floor(st.atk*.85));hit(target,Math.floor(st.atk*.85))}else{let mult={強撃:1.55,火炎斬り:1.8,アイス:2.1,"会心斬り":2.4,"奥義・紅蓮":3.4}[n]||1.5;hit(target,Math.floor(st.atk*mult),n==="会心斬り")}end()}
$("#auto").onclick=()=>{S.auto=!S.auto;render();clearInterval(timer);if(S.auto)timer=setInterval(()=>{if(S.auto)attack()},900)};
$("#ten").onclick=()=>{let c=0;S.auto=true;render();clearInterval(timer);timer=setInterval(()=>{if(c>=10){clearInterval(timer);S.auto=false;render();return}if(living().length)attack();else c++},700)};
function showFx(h){$("#fxcard").innerHTML=h;$("#fx").classList.add("show")}$("#fx").onclick=()=>{$("#fx").classList.remove("show");render()};
function open(t,b){$("#otitle").textContent=t;$("#obody").innerHTML=b;$("#overlay").classList.add("open")}$("#close").onclick=()=>$("#overlay").classList.remove("open");
function shopView(type){shopTab=type;let arr=shop.filter(x=>x.type===type);$("#obody").innerHTML=`<div class="tabs">${["武器","服","アクセ"].map(t=>`<button class="tab" data-tab="${t}">${t}</button>`).join("")}</div><div class="panel">${arr.map(x=>{let own=S.owned.includes(x.n),lock=S.lv<x.lv;return `<div class="row ${lock?"locked":""}"><span><b>${lock?"🔒 ":""}${x.n}</b><br><small>${x.desc}<br>Lv${x.lv}解放</small></span><button class="${own?"equip":"buy"}" data-buy="${x.id}" ${lock?"disabled":""}>${own?(S.equipment[x.type]===x.n?"装備中":"装備"):`${x.g}G`}</button></div>`}).join("")}</div>`;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>shopView(b.dataset.tab));document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buyEquip(b.dataset.buy))}
function buyEquip(id){let x=shop.find(a=>a.id===id);if(S.owned.includes(x.n)){S.equipment[x.type]=x.n;toast(`${x.n}を装備した`);shopView(shopTab);render();return}if(S.gold<x.g)return toast("Gが足りない");S.gold-=x.g;S.owned.push(x.n);S.equipment[x.type]=x.n;toast(`${x.n}を購入・装備！`);shopView(shopTab);render()}
function itemView(){let uniq=[...new Set(S.owned)];open("持ち物・装備",`<div class="panel">${uniq.map(n=>{let x=item(n),type=x.type||shop.find(q=>q.n===n)?.type|| (n.includes("剣")?"武器":n.includes("服")?"服":"アクセ");let eq=S.equipment[type]===n;return `<div class="row"><span><b>${n}</b><br><small>${x.desc||`攻撃+${x.atk||0} / 防御+${x.def||0}`}</small></span>${["武器","服","アクセ"].includes(type)?`<button class="equip" data-eq="${n}" data-type="${type}">${eq?"装備中":"装備"}</button>`:"所持"}</div>`}).join("")}<div class="row"><span>🌿 薬草</span><b>${S.herb}個</b></div></div>`);document.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{S.equipment[b.dataset.type]=b.dataset.eq;itemView();render()})}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{let p=b.dataset.page;
if(p==="stage")open("ステージ",`<div class="panel"><div class="row"><b>はじまりの草原 1</b><span>挑戦中</span></div><div class="row"><b>草原 2</b><span>${S.lv>=3?"解放済":"Lv3で解放"}</span></div><div class="row"><b>草原ボス</b><span>${S.lv>=5?"解放済":"Lv5で解放"}</span></div></div>`);
if(p==="party"){let st=stats();open("パーティ・ステータス",`<div class="panel"><div class="row"><b>のり Lv${S.lv}</b><span>EXP ${S.exp}/${needExp(S.lv)}</span></div><div class="row"><span>攻撃力</span><b>${st.atk}</b></div><div class="row"><span>防御力</span><b>${st.def}</b></div><div class="row"><span>会心率</span><b>${st.crit}%</b></div><div class="row"><span>武器</span><b>${S.equipment.武器}</b></div><div class="row"><span>服</span><b>${S.equipment.服}</b></div><div class="row"><span>アクセ</span><b>${S.equipment.アクセ}</b></div><div class="row"><span>仲間</span><b>${S.companions.join("・")}</b></div></div>`)};
if(p==="shop"){open("ショップ","");shopView("武器")}
if(p==="items")itemView();
if(p==="book"){const found=Object.entries(S.drops);open("図鑑",`<div class="panel">${Object.keys(S.kills).map(n=>`<div class="row"><span><b>${S.seen[n]?n:"???"}</b><br><small>討伐 ${S.kills[n]||0} / 仲間 ${S.companions.includes(n)?"加入済":"-"}</small></span><span>${n==="黄金スライム"?"✨ 突然変異":""}</span></div>`).join("")}</div><div class="panel"><b>発見したドロップ</b>${found.length?found.map(([n,c])=>`<div class="row"><span>${n}</span><b>${c}</b></div>`).join(""):`<p class="small">まだレアドロップを発見していない</p>`}</div>`)};
});
spawn();render()})();
</script></body></html>
