</style></head><body>
<main id="app">
<header class="top"><div class="logo">⚔ DROP HUNTER <small>v0.8</small></div><div class="expMini"><div>Lv <b id="lv"></b>　EXP <span id="expTxt"></span></div><div class="bar expbar"><i id="expFill"></i></div></div><div>💰 <b id="gold"></b>G</div></header>

<script>
(()=>{"use strict";
const $=s=>document.querySelector(s), KEY="dropHunter08", OLDKEY="dropHunter07";
const PARTY=["キーボ","ミア","トア"];
const needExp=l=>Math.floor(100+20*l+15*l*l);
const skillDefs=[["強撃",2,3,"単体・威力高"],["火炎斬り",3,5,"炎属性・単体"],["ヒール",5,5,"味方1人を回復"],["風刃",7,8,"敵全体"],["二連斬り",10,8,"2回攻撃"],["アイス",12,10,"氷属性・高威力"],["会心斬り",15,12,"会心率大"],["奥義・紅蓮",20,20,"超威力"]];
const shop=[
{id:"bronze",n:"銅の剣",type:"武器",lv:1,g:180,atk:3,def:0,crit:0,rar:"NORMAL",desc:"攻撃+3"},
{id:"iron",n:"鉄の剣",type:"武器",lv:3,g:420,atk:7,def:0,crit:0,rar:"NORMAL",desc:"攻撃+7"},
{id:"steel",n:"鋼の剣",type:"武器",lv:6,g:850,atk:12,def:0,crit:1,rar:"NORMAL",desc:"攻撃+12 / 会心+1%"},
{id:"fire",n:"炎の剣",type:"武器",lv:10,g:1800,atk:18,def:0,crit:2,rar:"RARE",desc:"攻撃+18 / 炎属性"},
{id:"cloth",n:"旅人の服",type:"防具",lv:1,g:120,atk:0,def:2,crit:0,rar:"NORMAL",desc:"防御+2"},
{id:"leather",n:"革の服",type:"防具",lv:4,g:360,atk:0,def:6,crit:0,rar:"NORMAL",desc:"防御+6"},
{id:"chain",n:"鎖かたびら",type:"防具",lv:8,g:950,atk:0,def:12,crit:0,rar:"NORMAL",desc:"防御+12"},
{id:"amulet",n:"小さなお守り",type:"アクセサリー",lv:1,g:100,atk:0,def:1,crit:1,rar:"NORMAL",desc:"防御+1 / 会心+1%"},
{id:"luck",n:"幸運のお守り",type:"アクセサリー",lv:6,g:800,atk:0,def:2,crit:1,drop:2,rar:"RARE",desc:"防御+2 / ドロップ率補正"},
{id:"magicring",n:"魔力の指輪",type:"アクセサリー",lv:12,g:2400,atk:5,def:2,crit:2,rar:"RARE",desc:"攻撃+5 / 防御+2"}
];
const drops={
スライム:[{n:"ぷるぷるゼリー",r:12,rar:"NORMAL",type:"素材",desc:"スライムから採れる素材"},{n:"スライムピアス",r:120,rar:"RARE",type:"アクセサリー",atk:0,def:2,crit:2,desc:"防御+2 / 会心+2%"}],
ゴブリン:[{n:"ゴブリンの牙",r:15,rar:"NORMAL",type:"素材",desc:"ゴブリンの素材"},{n:"盗賊の短剣",r:150,rar:"RARE",type:"武器",atk:14,def:0,crit:5,desc:"攻撃+14 / 会心+5%"}],
オオカミ:[{n:"狼の毛皮",r:18,rar:"NORMAL",type:"素材",desc:"オオカミの素材"},{n:"月狼の服",r:220,rar:"EPIC",type:"防具",atk:0,def:16,crit:2,desc:"防御+16 / 会心+2%"}]
};
const specialItems={"木の剣":{n:"木の剣",type:"武器",atk:1,def:0,crit:0,rar:"NORMAL",desc:"攻撃+1"},"幻の金冠":{n:"幻の金冠",type:"素材",rar:"PHANTOM",desc:"黄金スライムの幻級ドロップ"}};
const defaultState={lv:1,exp:0,gold:500,battle:1,herb:5,auto:false,hp:[70,52,60],max:[70,52,60],mp:[18,30,22],mpmax:[18,30,22],baseAtk:12,baseDef:3,guard:false,kills:{スライム:0,ゴブリン:0,オオカミ:0,"黄金スライム":0},seen:{},owned:["木の剣","旅人の服","小さなお守り"],equipment:{武器:"木の剣",防具:"旅人の服",アクセサリー:"小さなお守り"},monsterCompanions:[],drops:{},locks:{},golden:false};
let S=JSON.parse(JSON.stringify(defaultState));
try{
 let raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY); let x=raw&&JSON.parse(raw);
 if(x){S={...S,...x};
   if(x.equipment){S.equipment={武器:x.equipment.武器||"木の剣",防具:x.equipment.防具||x.equipment.服||"旅人の服",アクセサリー:x.equipment.アクセサリー||x.equipment.アクセ||"小さなお守り"};}
   const oldComp=(x.companions||[]).filter(n=>!["ミア","モフ","トア"].includes(n));
   S.monsterCompanions=[...new Set([...(x.monsterCompanions||[]),...oldComp])];
 }
}catch(e){}
S.locks=S.locks||{};S.monsterCompanions=S.monsterCompanions||[];
let E=[],target=0,timer=null,busy=false,shopTab="武器",itemTab="すべて",targetAction=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function item(n){return shop.find(x=>x.n===n)||Object.values(drops).flat().find(x=>x.n===n)||specialItems[n]||{n,type:"素材",atk:0,def:0,crit:0,rar:"NORMAL",desc:"アイテム"}}
function rarityClass(r){return r==="RARE"?"rar-rare":r==="EPIC"?"rar-epic":r==="PHANTOM"?"rar-phantom":"rar-normal"}
function stats(){let its=Object.values(S.equipment).map(item);return{atk:S.baseAtk+(S.lv-1)*3+its.reduce((a,x)=>a+(x.atk||0),0),def:S.baseDef+(S.lv-1)*2+its.reduce((a,x)=>a+(x.def||0),0),crit:5+its.reduce((a,x)=>a+(x.crit||0),0)}}
function equipStat(type){return item(S.equipment[type]||"")}
function compareText(x){if(!["武器","防具","アクセサリー"].includes(x.type))return "";let cur=equipStat(x.type);let a=(x.atk||0)-(cur.atk||0),d=(x.def||0)-(cur.def||0),c=(x.crit||0)-(cur.crit||0);let parts=[];if(a)parts.push(`攻撃 <span class="${a>0?'compareUp':'compareDown'}">${a>0?'+':''}${a}</span>`);if(d)parts.push(`防御 <span class="${d>0?'compareUp':'compareDown'}">${d>0?'+':''}${d}</span>`);if(c)parts.push(`会心 <span class="${c>0?'compareUp':'compareDown'}">${c>0?'+':''}${c}%</span>`);return parts.length?`<br><small>現在装備比：${parts.join(' / ')}</small>`:'<br><small>現在装備と同等</small>'}
const mons=[["スライム","💧",30,8,14],["ゴブリン","👺",42,11,19],["オオカミ","🐺",36,10,17]];
function spawn(){busy=false;let golden=Math.random()<1/120;E=[];if(golden){let mx=90+S.lv*9;E=[{name:"黄金スライム",base:"スライム",icon:"💧",hp:mx,max:mx,atk:13+S.lv,xp:120+S.lv*10,charge:false,golden:true}];S.seen["黄金スライム"]=true;showLog("✨ 幻の気配…黄金スライムが現れた！",1400)}else{let n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){let m=mons[Math.floor(Math.random()*mons.length)],mx=m[2]+S.lv*4;E.push({name:m[0],base:m[0],icon:m[1],hp:mx,max:mx,atk:m[3]+S.lv,xp:m[4]+S.lv*2,charge:false});S.seen[m[0]]=true}}target=0;render()}
function render(){let req=needExp(S.lv);$("#lv").textContent=S.lv;$("#gold").textContent=S.gold;$("#battleNo").textContent=S.battle;$("#expTxt").textContent=`${S.exp} / ${req}`;$("#expFill").style.width=Math.min(100,S.exp/req*100)+"%";$("#auto").textContent=S.auto?"AUTO ON":"AUTO OFF";$("#auto").classList.toggle("on",S.auto);
$("#enemies").innerHTML=E.map((e,i)=>`<div class="enemy ${e.hp<=0?'dead':''} ${i===target?'selected':''}" data-i="${i}"><div class="ebox">${e.charge?'⚠ 強攻撃準備<br>':''}${e.name} Lv${S.lv}<div class="bar mini hp"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div></div><div class="sprite"><div class="monster ${e.golden?'golden':''}">${e.icon}</div></div><div class="target">${i===target&&e.hp>0?'▲ TARGET':''}</div></div>`).join("");
document.querySelectorAll('.enemy').forEach(el=>el.onclick=()=>{let i=+el.dataset.i;if(E[i].hp>0){target=i;render()}});
$("#party").innerHTML=PARTY.map((n,i)=>`<div class="pcard ${S.hp[i]<=0?'ko':''}">${n} HP ${S.hp[i]}/${S.max[i]}<div class="bar hp"><i style="width:${S.max[i]?S.hp[i]/S.max[i]*100:0}%"></i></div><div class="bar mp"><i style="width:${S.mpmax[i]?S.mp[i]/S.mpmax[i]*100:0}%"></i></div>MP ${S.mp[i]}/${S.mpmax[i]}</div>`).join("");save()}
function living(){return E.filter(e=>e.hp>0)}function aliveParty(){return PARTY.map((_,i)=>i).filter(i=>S.hp[i]>0)}
function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(x._t);x._t=setTimeout(()=>x.style.display="none",1500)}
function showLog(t,ms=800){let x=$("#log");x.textContent=t;x.classList.add("show");clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("show"),ms)}
function floatText(t,xpct,ypct,cls=""){let d=document.createElement("div");d.className="float "+cls;d.textContent=t;d.style.left=xpct+"%";d.style.top=ypct+"%";$("#battle").appendChild(d);setTimeout(()=>d.remove(),800)}
function hit(i,d,crit=false){if(!E[i]||E[i].hp<=0)return;E[i].hp=Math.max(0,E[i].hp-d);floatText((crit?"CRITICAL! ":"")+"-"+d,12+i*31,29,crit?"crit":"")}
function partyDamage(i,d){if(S.hp[i]<=0)return;S.hp[i]=Math.max(0,S.hp[i]-d);floatText("-"+d,18+i*31,72);if(S.hp[i]===0)showLog(`${PARTY[i]}は戦闘不能！`,900)}
function wipe(){clearInterval(timer);S.auto=false;let lost=Math.floor(S.gold*.25);S.gold-=lost;S.hp=S.max.map(v=>Math.max(1,Math.floor(v*.6)));S.mp=S.mpmax.map(v=>Math.max(1,Math.floor(v*.6)));showFx(`<h1>全滅…</h1><p>${lost}Gを失った</p><p class="small">拠点でHP・MPが60%まで回復した</p><p class="small">タップして再開</p>`);S.battle++;setTimeout(spawn,300);render()}
function enemyTurn(){living().forEach(e=>{let ap=aliveParty();if(!ap.length)return;let i=ap[Math.floor(Math.random()*ap.length)];if(e.charge){let raw=e.atk*2,d=Math.max(1,raw-stats().def);if(S.guard)d=Math.max(1,Math.floor(d*.35));partyDamage(i,d);e.charge=false;showLog(`${e.name}の強攻撃！ ${PARTY[i]}に${d}ダメージ`)}else if(Math.random()<.2){e.charge=true;showLog(`⚠ ${e.name}が力を溜めている！ 次は強攻撃`)}else{let d=Math.max(1,e.atk-stats().def);if(S.guard)d=Math.max(1,Math.floor(d*.35));partyDamage(i,d);showLog(`${e.name}の攻撃！ ${PARTY[i]}に${d}ダメージ`)}});S.guard=false;if(!aliveParty().length)wipe()}
function addOwned(n){S.owned.push(n)}
function rollDrops(e){if(e.golden){addOwned("幻の金冠");S.drops["幻の金冠"]=(S.drops["幻の金冠"]||0)+1;S.locks["幻の金冠"]=true;showDrop("幻の金冠","PHANTOM");if(!S.monsterCompanions.includes("黄金スライム")){S.monsterCompanions.push("黄金スライム");setTimeout(()=>showFx(`<h1 class="goldTitle">NEW COMPANION!</h1><div class="dropItem">✨ 黄金スライムが仲間になった！</div><p class="small">パーティ → 仲間モンスターで確認できます</p>`),900)}return}
for(let d of (drops[e.base]||[])){let bonus=(S.equipment.アクセサリー==="幸運のお守り"?1.35:1);if(Math.random()<bonus/d.r){addOwned(d.n);S.drops[d.n]=(S.drops[d.n]||0)+1;if(d.rar!=="NORMAL")S.locks[d.n]=true;if(d.rar!=="NORMAL")setTimeout(()=>showDrop(d.n,d.rar),350);else toast(`${d.n}を手に入れた！`)}}}
function showDrop(n,rar){showFx(`<h1 class="dropTitle">${rar==="PHANTOM"?'PHANTOM':rar==="EPIC"?'EPIC':'RARE'} DROP!</h1><div class="dropItem ${rarityClass(rar)}">${n}</div><p class="${rarityClass(rar)}">${rar}</p><p class="small">${rar!=='NORMAL'?'レア品は自動ロック済み':'タップして続ける'}</p>`) }
function addExp(x){S.exp+=x;let req=needExp(S.lv);if(S.exp>=req){S.exp-=req;let old=S.lv,oldSt=stats(),oldMax=S.max[0],oldMp=S.mpmax[0];S.lv++;S.max=S.max.map((v,i)=>v+[6,4,5][i]);S.mpmax=S.mpmax.map((v,i)=>v+[2,3,2][i]);S.hp=[...S.max];S.mp=[...S.mpmax];let ns=stats();showFx(`<div>✦　✧　✦</div><h1>LEVEL UP!</h1><h2>Lv.${old} → Lv.${S.lv}</h2><div class="growth"><div>HP<br><b>${oldMax} → ${S.max[0]}</b></div><div>MP<br><b>${oldMp} → ${S.mpmax[0]}</b></div><div>攻撃力<br><b>${oldSt.atk} → ${ns.atk}</b></div><div>防御力<br><b>${oldSt.def} → ${ns.def}</b></div></div>${skillDefs.find(s=>s[1]===S.lv)?`<div class="newskill">NEW SKILL! 「${skillDefs.find(s=>s[1]===S.lv)[0]}」を覚えた！</div>`:''}<p class="small">タップして続ける</p>`)}}
function afterBattleHeal(){let vals=S.hp.map((h,i)=>{let r=10+Math.floor(Math.random()*6),before=h;S.hp[i]=Math.min(S.max[i],h+r);return S.hp[i]-before});toast(`戦闘後回復　${PARTY.map((n,i)=>`${n}+${vals[i]}`).join(' / ')}`)}
function finish(){if(living().length)return false;let xp=E.reduce((a,e)=>a+e.xp,0),g=8+E.length*7+Math.floor(Math.random()*10)+(E.some(e=>e.golden)?250:0);E.forEach(e=>{S.kills[e.name]=(S.kills[e.name]||0)+1;rollDrops(e)});S.gold+=g;addExp(xp);afterBattleHeal();showLog(`勝利！ EXP +${xp} / +${g}G`,1000);S.battle++;render();setTimeout(spawn,900);return true}
function end(){if(finish())return;let idx=E.findIndex(e=>e.hp>0);if(idx>=0)target=idx;enemyTurn();render()}
function attack(){if(busy||S.hp[0]<=0)return toast("キーボは戦闘不能");let st=stats(),crit=Math.random()<st.crit/100,d=Math.floor(st.atk*(.85+Math.random()*.3)*(crit?1.8:1));showLog("キーボの攻撃！");hit(target,d,crit);end()}
$("#attack").onclick=attack;$("#guard").onclick=()=>{if(S.hp[0]<=0)return toast("キーボは戦闘不能");S.guard=true;showLog("キーボは防御の構え！");enemyTurn();render()};
function openTarget(title,cb,allowKO=false){targetAction=cb;$("#targetTitle").textContent=title;$("#targetList").innerHTML=PARTY.map((n,i)=>`<button class="targetBtn" data-ti="${i}" ${(!allowKO&&S.hp[i]<=0)?'disabled':''}>${n}<br><small>HP ${S.hp[i]}/${S.max[i]}</small></button>`).join('');document.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{let i=+b.dataset.ti;$("#targetSheet").classList.remove('open');let f=targetAction;targetAction=null;f&&f(i)});$("#targetSheet").classList.add('open')}
$("#targetClose").onclick=()=>{$("#targetSheet").classList.remove('open');targetAction=null};
$("#herb").onclick=()=>{if(!S.herb)return toast("薬草がない");openTarget("薬草を使う相手",i=>{if(S.hp[i]<=0)return toast("戦闘不能には使えない");S.herb--;let before=S.hp[i];S.hp[i]=Math.min(S.max[i],S.hp[i]+35);floatText("+"+(S.hp[i]-before),18+i*31,72,"heal");render()})};
function renderSkills(){let unlocked=skillDefs.filter(s=>S.lv>=s[1]);$("#skillList").innerHTML=unlocked.map(s=>`<button class="skill" data-sk="${s[0]}"><b>${s[0]}</b><small>MP${s[2]} / ${s[3]}</small></button>`).join("")+(unlocked.length?`<div class="small">次の技：${(skillDefs.find(s=>S.lv<s[1])||['全習得'])[0]}</div>`:'');document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>useSkill(b.dataset.sk))}
$("#skillsBtn").onclick=()=>{renderSkills();$("#skillSheet").classList.add("open")};$("#skillClose").onclick=()=>$("#skillSheet").classList.remove("open");
function useSkill(n){let s=skillDefs.find(x=>x[0]===n);if(S.hp[0]<=0)return toast("キーボは戦闘不能");if(S.mp[0]<s[2])return toast("MPが足りない");if(n==="ヒール"){ $("#skillSheet").classList.remove("open");openTarget("ヒールの対象",i=>{if(S.mp[0]<s[2])return;S.mp[0]-=s[2];let b=S.hp[i];S.hp[i]=Math.min(S.max[i],S.hp[i]+45+S.lv*2);showLog(`キーボは${PARTY[i]}にヒール！`);floatText("+"+(S.hp[i]-b),18+i*31,72,"heal");render()});return}S.mp[0]-=s[2];$("#skillSheet").classList.remove("open");showLog(`キーボは「${n}」！`);let st=stats();if(n==="風刃")E.forEach((e,i)=>hit(i,Math.floor(st.atk*1.15)));else if(n==="二連斬り"){hit(target,Math.floor(st.atk*.85));hit(target,Math.floor(st.atk*.85))}else{let mult={強撃:1.55,火炎斬り:1.8,アイス:2.1,"会心斬り":2.4,"奥義・紅蓮":3.4}[n]||1.5;hit(target,Math.floor(st.atk*mult),n==="会心斬り")}end()}
$("#auto").onclick=()=>{S.auto=!S.auto;render();clearInterval(timer);if(S.auto)timer=setInterval(()=>{if(S.auto)attack()},900)};
$("#ten").onclick=()=>{let startBattle=S.battle,targetBattle=startBattle+10;S.auto=true;render();clearInterval(timer);timer=setInterval(()=>{if(S.battle>=targetBattle||!S.auto){clearInterval(timer);S.auto=false;render();return}attack()},750)};
function showFx(h){$("#fxcard").innerHTML=h;$("#fx").classList.add("show")}$("#fx").onclick=()=>{$("#fx").classList.remove("show");render()};
function open(t,b){$("#otitle").textContent=t;$("#obody").innerHTML=b;$("#overlay").classList.add("open")}$("#close").onclick=()=>$("#overlay").classList.remove("open");
function shopView(type){shopTab=type;let arr=shop.filter(x=>x.type===type);$("#obody").innerHTML=`<div class="tabs">${["武器","防具","アクセサリー"].map(t=>`<button class="tab" data-tab="${t}">${t}</button>`).join('')}</div><div class="panel">${arr.map(x=>{let own=S.owned.includes(x.n),lock=S.lv<x.lv;return `<div class="row ${lock?'locked':''}"><span><b class="${rarityClass(x.rar)}">${lock?'🔒 ':''}${x.n}</b><br><small>${x.desc}<br>Lv${x.lv}解放</small>${own?compareText(x):''}</span><button class="${own?'equip':'buy'}" data-buy="${x.id}" ${lock?'disabled':''}>${own?(S.equipment[x.type]===x.n?'装備中':'装備'):`${x.g}G`}</button></div>`}).join('')}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>shopView(b.dataset.tab));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyEquip(b.dataset.buy))}
function buyEquip(id){let x=shop.find(a=>a.id===id);if(S.owned.includes(x.n)){S.equipment[x.type]=x.n;toast(`${x.n}を装備した`);shopView(shopTab);render();return}if(S.gold<x.g)return toast("Gが足りない");S.gold-=x.g;S.owned.push(x.n);S.equipment[x.type]=x.n;toast(`${x.n}を購入・装備！`);shopView(shopTab);render()}
function countOwned(n){return S.owned.filter(x=>x===n).length}
function categoryOf(n){if(n==="薬草")return "アイテム";return item(n).type||"素材"}
function itemView(tab=itemTab){itemTab=tab;let names=[...new Set(S.owned)];if(tab!=="すべて")names=names.filter(n=>categoryOf(n)===tab);let tabs=["すべて","武器","防具","アクセサリー","アイテム","素材"];open("持ち物・装備",`<div class="itemTabs">${tabs.map(t=>`<button class="tab ${t===tab?'active':''}" data-itab="${t}">${t}</button>`).join('')}</div><div class="panel">${names.map(n=>itemRow(n)).join('')}${(tab==='すべて'||tab==='アイテム')?`<div class="row"><span><b>🌿 薬草</b><br><small>味方1人のHPを35回復</small></span><b>${S.herb}個</b></div>`:''}${!names.length&&(tab!=='アイテム')?'<p class="small">このカテゴリーにはまだ何もありません</p>':''}</div>`);document.querySelectorAll('[data-itab]').forEach(b=>b.onclick=()=>itemView(b.dataset.itab));document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{S.equipment[b.dataset.type]=b.dataset.eq;itemView(itemTab);render()});document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{let n=b.dataset.lock;S.locks[n]=!S.locks[n];itemView(itemTab);save()});document.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>discard(b.dataset.trash))}
function itemRow(n){let x=item(n),type=categoryOf(n),eq=S.equipment[type]===n,locked=!!S.locks[n],cnt=countOwned(n),dropSource=Object.values(drops).flat().some(d=>d.n===n)||n==="幻の金冠";return `<div class="row"><span><b class="${rarityClass(x.rar)}">${n}${cnt>1?` ×${cnt}`:''}</b> <span class="typeBadge">${type}</span><br><small>${x.desc||''}</small>${dropSource?'<br><span class="sourceDrop">MONSTER DROP</span>':''}${compareText(x)}</span><span class="itemActions">${["武器","防具","アクセサリー"].includes(type)?`<button class="miniBtn" data-eq="${n}" data-type="${type}">${eq?'装備中':'装備'}</button>`:''}<button class="miniBtn ${locked?'lockedBtn':''}" data-lock="${n}">${locked?'🔒':'🔓'}</button><button class="miniBtn danger" data-trash="${n}" ${eq||locked?'disabled':''}>捨てる</button></span></div>`}
function discard(n){let x=item(n);if(Object.values(S.equipment).includes(n))return toast("装備中は捨てられない");if(S.locks[n])return toast("ロック中です");if(x.rar!=="NORMAL"&&!confirm(`レアアイテム「${n}」を捨てますか？`))return;let i=S.owned.indexOf(n);if(i>=0)S.owned.splice(i,1);toast(`${n}を1個捨てた`);itemView(itemTab);save()}
function partyView(mode="members"){let st=stats();if(mode==="members")open("パーティ",`<div class="tabs"><button class="tab" data-pmode="members">3人</button><button class="tab" data-pmode="monsters">仲間モンスター</button></div><div class="panel"><div class="row"><b>キーボ Lv${S.lv}</b><span>EXP ${S.exp}/${needExp(S.lv)}</span></div><div class="row"><span>攻撃力</span><b>${st.atk}</b></div><div class="row"><span>防御力</span><b>${st.def}</b></div><div class="row"><span>武器</span><b>${S.equipment.武器}</b></div><div class="row"><span>防具</span><b>${S.equipment.防具}</b></div><div class="row"><span>アクセサリー</span><b>${S.equipment.アクセサリー}</b></div><div class="sectionTitle">固定パーティ</div>${PARTY.map((n,i)=>`<div class="row"><span><b>${n}</b></span><span>HP ${S.hp[i]}/${S.max[i]}　MP ${S.mp[i]}/${S.mpmax[i]}</span></div>`).join('')}</div>`);else open("仲間モンスター",`<div class="tabs"><button class="tab" data-pmode="members">3人</button><button class="tab" data-pmode="monsters">仲間モンスター</button></div><div class="panel">${S.monsterCompanions.length?S.monsterCompanions.map((n,i)=>`<div class="compCard"><b class="${n==='黄金スライム'?'rar-phantom':''}">${n}</b><div class="small">個体 No.${i+1}　Lv1</div><div class="small">HP ${n==='黄金スライム'?95:60} / 攻撃 ${n==='黄金スライム'?18:10} / 防御 ${n==='黄金スライム'?12:8}</div><div class="small">特性：${n==='黄金スライム'?'幸運のきらめき（試作）':'未設定'}</div></div>`).join(''):'<p class="small">まだ仲間モンスターはいません。<br>仲間になるとここに追加されます。</p>'}</div>`);document.querySelectorAll('[data-pmode]').forEach(b=>b.onclick=()=>partyView(b.dataset.pmode))}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{let p=b.dataset.page;if(p==="stage")open("ステージ",`<div class="panel"><div class="row"><b>はじまりの草原 1</b><span>挑戦中</span></div><div class="row"><b>草原 2</b><span>${S.lv>=3?'解放済':'Lv3で解放'}</span></div><div class="row"><b>草原ボス</b><span>${S.lv>=5?'解放済':'Lv5で解放'}</span></div></div>`);if(p==="party")partyView();if(p==="shop"){open("ショップ","");shopView("武器")}if(p==="items")itemView();if(p==="book"){const found=Object.entries(S.drops);open("図鑑",`<div class="panel">${Object.keys(S.kills).map(n=>`<div class="row"><span><b>${S.seen[n]?n:'???'}</b><br><small>討伐 ${S.kills[n]||0} / 仲間 ${S.monsterCompanions.includes(n)?'加入済':'-'}</small></span><span>${n==='黄金スライム'?'✨ 突然変異':''}</span></div>`).join('')}</div><div class="panel"><b>発見したドロップ</b>${found.length?found.map(([n,c])=>{let x=item(n);return `<div class="row"><span class="${rarityClass(x.rar)}">${n}</span><b>${c}</b></div>`}).join(''):'<p class="small">まだドロップを発見していない</p>'}</div>`)}});
spawn();render();
})();
</script></body></html>
