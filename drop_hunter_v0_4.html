<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DROP HUNTER v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:110px}.top{height:92px;display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:3px solid #d9b74f;font-weight:900;font-size:22px}.gold{color:#f4d46b}.stage{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 12px;font-size:23px;font-weight:900}
.battle{position:relative;height:500px;margin:0 18px;border:5px solid #d6b653;border-radius:14px;overflow:hidden;background:linear-gradient(#4eafe2 0 43%,#9ce55d 43% 64%,#45a934 64%)}
.cloud{position:absolute;top:50px;left:45px;width:130px;height:30px;border-radius:30px;background:#eef9ff}.cloud:after{content:"";position:absolute;width:80px;height:30px;left:45px;top:12px;border-radius:30px;background:#eef9ff}
.enemies{position:absolute;left:3%;right:3%;top:140px;height:230px;display:flex;align-items:flex-end;justify-content:space-around;gap:8px}
.enemy{width:31%;text-align:center;cursor:pointer}.ebox{background:#09172b;border:3px solid #526984;border-radius:10px;padding:6px 4px;font-weight:900;font-size:13px}.enemy.sel .ebox{border-color:#ffe064;box-shadow:0 0 15px #ffe064}.hpbar{height:9px;background:#26364c;margin-top:5px;border:1px solid #8a9bb0}.hpfill{height:100%;background:#ef5c6b}.monster{height:100px;display:flex;align-items:flex-end;justify-content:center;font-size:74px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}.target{height:22px;color:#ffe887;font-size:12px;font-weight:800}.party-art{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:55px;font-size:52px}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 18px}.card{border:3px solid #455d7d;border-radius:10px;padding:9px;background:#0b192d;font-weight:800}.green{height:8px;background:#76dd78;margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px}.btn{min-height:74px;border:3px solid #7890ae;border-radius:10px;background:#263d61;color:#fff;font-size:18px;font-weight:900}.attack{background:#ad4b43}.skill{background:#2e68ad}.magic{background:#6849a7}.heal{background:#408d51}.btn:active{transform:scale(.97)}
.log{margin:14px 18px;background:#020914;border:3px solid #344b6b;border-radius:9px;padding:12px;height:100px;overflow:auto;font-size:14px}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;height:82px;background:rgba(3,12,25,.97);border-top:3px solid #d6b653;display:flex;justify-content:space-around;align-items:center}.tab{text-align:center;font-size:13px}.tab b{display:block;font-size:25px;margin-bottom:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;padding:60px 18px}.panel{max-width:650px;margin:auto;background:#0d1d34;border:3px solid #d6b653;border-radius:14px;padding:18px}.panel h2{margin-top:0}.spell{padding:12px;border-bottom:1px solid #42536b}.close{width:100%;padding:14px;margin-top:14px}
.small{font-size:12px;color:#c7d3e3}
</style>
</head>
<body><main class="app">
<div class="top"><div>⚔️ <span class="gold">DROP HUNTER</span> <small>v0.4</small></div><div>Lv <span id="lv">1</span>　💰 <span id="gold">500</span>G</div></div>
<div class="stage"><span>はじまりの草原 1</span><span><span id="battleNo">1</span>戦目</span></div>
<section class="battle"><div class="cloud"></div><div class="enemies" id="enemies"></div><div class="party-art"><span>🗡️</span><span>🧙‍♀️</span><span>🐱</span></div></section>
<div class="party"><div class="card">のり<br><span id="hp1">60/60</span><div class="green"></div></div><div class="card">ミア<br><span id="hp2">42/42</span><div class="green"></div></div><div class="card">モフ<br><span id="hp3">50/50</span><div class="green"></div></div></div>
<div class="actions">
<button class="btn attack" onclick="attack()">⚔️ 攻撃<br><span class="small">単体</span></button>
<button class="btn skill" onclick="flameSlash()">🔥 火炎斬り<br><span class="small">単体</span></button>
<button class="btn magic" onclick="fire()">🔥 ファイア<br><span class="small">全体</span></button>
<button class="btn" onclick="toggleAuto()" id="auto">AUTO OFF</button>
<button class="btn" onclick="multiBattle()">▶ 10戦</button>
<button class="btn heal" onclick="heal()">🧪 薬草</button>
</div>
<div class="log" id="log">草原にやってきた。</div>
<div class="tabs"><div class="tab" onclick="showSpells()"><b>⚔️</b>技・呪文</div><div class="tab"><b>💰</b>ショップ</div><div class="tab"><b>🎒</b>持ち物</div><div class="tab"><b>📖</b>図鑑</div></div>
</main>
<div class="modal" id="modal"><div class="panel"><h2>技・呪文</h2><div id="spellList"></div><button class="btn close" onclick="closeModal()">閉じる</button></div></div>
<script>
let state=JSON.parse(localStorage.getItem("dh04")||"null")||{lv:1,xp:0,gold:500,battle:1,auto:false,hp:[60,42,50]};
let enemies=[],target=0,autoTimer=null;
const pool=[["スライム","💧",30,6],["ゴブリン","👺",38,8],["ウルフ","🐺",34,9]];
function save(){localStorage.setItem("dh04",JSON.stringify(state))}
function log(t){let e=document.getElementById("log");e.innerHTML=t+"<br>"+e.innerHTML}
function spawn(){
 let n=Math.random()<.35?1:Math.random()<.65?2:3; enemies=[];
 for(let i=0;i<n;i++){let p=pool[Math.floor(Math.random()*pool.length)],max=p[2]+state.lv*3;enemies.push({name:p[0],icon:p[1],hp:max,max,atk:p[3]+Math.floor(state.lv/3)})}
 target=0;render();
}
function render(){
 document.getElementById("lv").textContent=state.lv;document.getElementById("gold").textContent=state.gold;document.getElementById("battleNo").textContent=state.battle;
 ["hp1","hp2","hp3"].forEach((x,i)=>document.getElementById(x).textContent=state.hp[i]+"/"+[60,42,50][i]);
 let box=document.getElementById("enemies");box.innerHTML="";
 enemies.forEach((e,i)=>{let d=document.createElement("div");d.className="enemy "+(i===target?"sel":"");d.onclick=()=>{if(e.hp>0){target=i;render()}};
 d.innerHTML=`<div class="ebox">${e.name} Lv${state.lv}<div class="hpbar"><div class="hpfill" style="width:${100*e.hp/e.max}%"></div></div></div><div class="monster">${e.icon}</div><div class="target">${i===target&&e.hp>0?"▲ TARGET":""}</div>`;box.appendChild(d)});
 document.getElementById("auto").textContent=state.auto?"AUTO ON":"AUTO OFF";save();
}
function alive(){return enemies.filter(e=>e.hp>0)}
function nextTarget(){let i=enemies.findIndex(e=>e.hp>0);target=i<0?0:i}
function hitEnemy(i,dmg,label){let e=enemies[i];if(!e||e.hp<=0)return;e.hp=Math.max(0,e.hp-dmg);log(`${label}！ ${e.name}に${dmg}ダメージ`);if(e.hp===0)log(`${e.name}を倒した！`)}
function enemyTurn(){
 alive().forEach(e=>{let who=Math.floor(Math.random()*3),d=Math.max(1,e.atk+Math.floor(Math.random()*5)-2);state.hp[who]=Math.max(0,state.hp[who]-d);log(`${e.name}の攻撃！ ${["のり","ミア","モフ"][who]}に${d}ダメージ`)});
 render();
}
function finishCheck(){
 if(alive().length)return false;
 let g=8+Math.floor(Math.random()*15)+enemies.length*4,x=8+enemies.length*5;state.gold+=g;state.xp+=x;log(`勝利！ +${g}G / EXP +${x}`);
 while(state.xp>=state.lv*35){state.xp-=state.lv*35;state.lv++;log(`LEVEL UP！ Lv${state.lv}になった！`);if([3,5,8,12].includes(state.lv))log(`新しい技・呪文を覚えた！`)}
 state.battle++;state.hp=state.hp.map((h,i)=>Math.min([60,42,50][i],h+4));spawn();return true;
}
function actEnd(){nextTarget();render();if(finishCheck())return;setTimeout(enemyTurn,220)}
function attack(){let a=alive();if(!a.length)return;hitEnemy(target,12+state.lv*2,"攻撃");actEnd()}
function flameSlash(){if(state.lv<2){log("火炎斬りはLv2で使用可能。");return}hitEnemy(target,22+state.lv*3,"火炎斬り");actEnd()}
function fire(){if(state.lv<3){log("ファイアはLv3で習得する。");return}alive().forEach((e,i)=>hitEnemy(i,11+state.lv*2,"ファイア"));actEnd()}
function heal(){let i=state.hp.indexOf(Math.min(...state.hp));state.hp[i]=Math.min([60,42,50][i],state.hp[i]+25);log(`${["のり","ミア","モフ"][i]}のHPを回復した。`);render()}
function toggleAuto(){state.auto=!state.auto;render();clearInterval(autoTimer);if(state.auto)autoTimer=setInterval(()=>{if(state.auto)attack()},850)}
async function multiBattle(){for(let k=0;k<10;k++){if(!alive().length)spawn();while(alive().length){let i=enemies.findIndex(e=>e.hp>0);hitEnemy(i,18+state.lv*3,"連戦攻撃");if(alive().length)enemyTurn()}finishCheck();await new Promise(r=>setTimeout(r,90))}}
function showSpells(){let skills=[["通常攻撃","最初から","単体"],["火炎斬り","Lv2","単体"],["ファイア","Lv3","全体"],["ヒール","Lv5","味方単体"],["烈火斬","Lv8","単体・高威力"],["メテオ","Lv12","敵全体・大魔法"]];document.getElementById("spellList").innerHTML=skills.map(s=>`<div class="spell"><b>${s[0]}</b>　${s[2]}<br><span class="small">習得：${s[1]}</span></div>`).join("");document.getElementById("modal").style.display="block"}
function closeModal(){document.getElementById("modal").style.display="none"}
spawn();render();
</script></body></html>
