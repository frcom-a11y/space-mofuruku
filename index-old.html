<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#081426"><title>DROP HUNTER Prototype v0.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#07101e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{width:min(100%,480px);min-height:100dvh;margin:auto;background:linear-gradient(#0d1d34,#07101e);padding-bottom:82px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#081426;border-bottom:2px solid #e2b84d;font-weight:800}.brand{color:#ffd86b}.screen{padding:10px}.stage{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}.stage h2{font-size:18px;margin:0}.pill{font-size:12px;padding:5px 8px;border:1px solid #d8b75a;border-radius:99px;color:#ffe18a}.battlefield{height:310px;border:3px solid #d7b24f;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(#4ab4ee 0 42%,#9ee45d 42% 62%,#5fb23f 62%);box-shadow:inset 0 0 0 3px #15243a}.battlefield:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(0deg,#4c9b35 0 6px,#55a63b 6px 12px);opacity:.55}.mount{position:absolute;width:120px;height:70px;background:#76b3c8;clip-path:polygon(0 100%,35% 25%,55% 70%,75% 5%,100% 100%);top:78px;right:0;opacity:.75}.cloud{position:absolute;top:30px;left:28px;width:68px;height:20px;background:#fff;border-radius:20px;box-shadow:25px 5px #fff;opacity:.9}.enemyBox{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:180px;background:#07101ee8;border:2px solid #f0d57a;border-radius:7px;padding:6px 8px;z-index:4}.enemyName{font-weight:900;font-size:13px}.bar{height:10px;background:#1c293c;border:1px solid #617087;margin-top:4px}.bar>i{display:block;height:100%;background:#ef5361;width:100%;transition:width .18s}.sprite{position:absolute;z-index:5;left:50%;top:98px;transform:translateX(-50%);width:96px;height:96px;filter:drop-shadow(6px 8px 0 #17311f88);transition:.12s}.sprite.hit{transform:translateX(-50%) scale(.82)}.slime{background:radial-gradient(circle at 38% 38%,#70e8ff 0 7%,transparent 8%),linear-gradient(145deg,#41d4ff,#087ed8 72%);border:5px solid #063b76;border-radius:52% 52% 45% 45%;clip-path:polygon(50% 0,68% 20%,88% 43%,95% 67%,85% 88%,64% 100%,34% 100%,12% 88%,4% 67%,12% 42%,32% 20%)}.slime:before,.slime:after{content:"";position:absolute;top:49px;width:9px;height:13px;background:#07101e;border-radius:50%}.slime:before{left:27px}.slime:after{right:27px}.gold{background:radial-gradient(circle at 38% 38%,#fff6a4 0 7%,transparent 8%),linear-gradient(145deg,#fff36a,#e6a700 72%);border-color:#8a5900}.crown{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:7;font-size:36px;display:none}.heroes{position:absolute;left:0;right:0;bottom:13px;display:flex;justify-content:center;gap:22px;z-index:6;align-items:end}.hero{font-size:49px;filter:drop-shadow(3px 4px #17311f)}.hero:nth-child(2){font-size:46px}.hero:nth-child(3){font-size:43px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.card{background:#0b1728;border:2px solid #415774;border-radius:6px;padding:7px;font-size:11px}.card b{display:block;font-size:12px}.hpbar{height:7px;background:#3b2430;margin-top:5px}.hpbar i{display:block;height:100%;background:#5fd36b}.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.cmd{min-height:54px;border:2px solid #8aa0c0;border-radius:7px;background:#263b59;font-weight:900;box-shadow:0 4px #030811}.cmd:active{transform:translateY(3px);box-shadow:0 1px #030811}.attack{background:#a8423f}.skill{background:#2262a8}.item{background:#2c8b52}.auto.on{background:#a16c17}.log{height:98px;overflow:auto;margin-top:9px;padding:8px;background:#050a12;border:2px solid #3b506d;border-radius:6px;font-size:12px;line-height:1.55}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:#07101ef5;border-top:2px solid #d8b75a;padding-bottom:max(6px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:9px 2px 7px;font-size:11px}.nav span{display:block;font-size:21px}.modal{display:none;position:fixed;inset:0;z-index:50;background:#02060dcc;align-items:flex-end;justify-content:center}.modal.show{display:flex}.panel{width:min(100%,480px);max-height:82dvh;overflow:auto;background:#0d1a2c;border:2px solid #d8b75a;border-radius:14px 14px 0 0;padding:14px 12px 26px}.panel h2{margin:0 0 10px;color:#ffdc72}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#101f34;border:1px solid #3c5678;border-radius:7px;padding:9px;margin:7px 0}.buy{background:#1769b0;border:1px solid #7ec6ff;border-radius:5px;padding:7px 11px;font-weight:800}.close{width:100%;margin-top:10px;background:#3c4658;border:1px solid #8594aa;border-radius:6px;padding:11px}.rareFlash{animation:flash .55s 3}@keyframes flash{50%{filter:brightness(2)}}.toast{position:fixed;z-index:80;left:50%;top:20%;transform:translateX(-50%);width:min(88%,390px);padding:14px;background:#07101ef2;border:2px solid #ffe36c;border-radius:8px;text-align:center;font-weight:900;display:none}.toast.show{display:block}.small{font-size:11px;color:#c5d2e6}
</style></head><body><main class="app" id="app"><header class="top"><div class="brand">⚔ DROP HUNTER <span class="small">v0.2</span></div><div>Lv <span id="lv">1</span>　💰 <span id="gold">500</span>G</div></header><section class="screen"><div class="stage"><h2>はじまりの草原 1</h2><div class="pill"><span id="battleNo">1</span>戦目</div></div><div class="battlefield" id="field"><div class="cloud"></div><div class="mount"></div><div class="enemyBox"><div class="enemyName" id="enemyName">スライム Lv1</div><div class="bar"><i id="enemyHpBar"></i></div></div><div class="crown" id="crown">♛</div><div class="sprite slime" id="enemySprite"></div><div class="heroes"><div class="hero">🗡️</div><div class="hero">🧙‍♀️</div><div class="hero">🐱</div></div></div><div class="cards"><div class="card"><b>のり</b>HP <span id="p1hp">60</span>/60<div class="hpbar"><i></i></div></div><div class="card"><b>ミア</b>HP 42/42<div class="hpbar"><i></i></div></div><div class="card"><b>モフ</b>HP 50/50<div class="hpbar"><i></i></div></div></div><div class="commands"><button class="cmd attack" id="attack">⚔ 攻撃</button><button class="cmd skill" id="skill">🔥 火炎斬り</button><button class="cmd item" id="heal">🧪 薬草</button><button class="cmd auto" id="auto">AUTO OFF</button><button class="cmd" id="ten">▶ 10戦</button><button class="cmd" id="next">次の敵</button></div><div class="log" id="log">草原にやってきた。<br>スライムが現れた！</div></section><nav class="nav"><button data-open="party"><span>⚔️</span>パーティ</button><button data-open="shop"><span>💰</span>ショップ</button><button data-open="bag"><span>🎒</span>持ち物</button><button data-open="book"><span>📖</span>図鑑</button></nav></main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let S=JSON.parse(localStorage.getItem('dhv02')||'null')||{lv:1,exp:0,gold:500,battles:0,kills:0,herb:10,slimeFriend:false,goldSlime:false,rare:0,atk:10,weapon:'木の剣'};let E={name:'スライム',hp:24,max:24,gold:false};let autoTimer=null,busy=false;function save(){localStorage.setItem('dhv02',JSON.stringify(S));render()}function render(){$('lv').textContent=S.lv;$('gold').textContent=S.gold;$('battleNo').textContent=S.battles+1;$('enemyName').textContent=E.name+' Lv'+Math.max(1,Math.ceil(S.lv*.7));$('enemyHpBar').style.width=Math.max(0,E.hp/E.max*100)+'%';$('auto').textContent=autoTimer?'AUTO ON':'AUTO OFF';$('auto').classList.toggle('on',!!autoTimer)}function log(t){$('log').innerHTML+=`<br>${t}`;$('log').scrollTop=$('log').scrollHeight}function toast(t){$('toast').innerHTML=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function spawn(){const g=Math.random()<1/120;E=g?{name:'黄金スライム',hp:44,max:44,gold:true}:{name:'スライム',hp:24+S.lv*2,max:24+S.lv*2,gold:false};$('enemySprite').className='sprite slime'+(g?' gold':'');$('crown').style.display=g?'block':'none';if(g){toast('！！！<br>黄金スライムが現れた！');log('黄金スライムが現れた！')}else log('スライムが現れた！');render()}function hit(dmg){if(busy)return;busy=true;E.hp-=dmg;$('enemySprite').classList.add('hit');setTimeout(()=>$('enemySprite').classList.remove('hit'),120);render();setTimeout(()=>{busy=false;if(E.hp<=0)win()},170)}function win(){S.kills++;S.battles++;let money=E.gold?500:8+Math.floor(Math.random()*8);S.gold+=money;log(`${E.name}を倒した！ +${money}G`);if(E.gold&&!S.goldSlime){S.goldSlime=true;toast('★ 黄金スライム撃破 ★<br>仲間になった！');log('黄金スライムが仲間になった！')}if(!E.gold&&!S.slimeFriend&&Math.random()<1/40){S.slimeFriend=true;toast('★ 仲間獲得 ★<br>スライムが仲間になった！')}if(Math.random()<1/70){S.rare++;toast('✨ レアドロップ！<br>青い指輪を手に入れた');log('青い指輪を手に入れた！')}if(S.kills%6===0){S.lv++;S.atk+=2;toast('LEVEL UP！ Lv'+S.lv)}save();setTimeout(spawn,450)}$('attack').onclick=()=>hit(S.atk+Math.floor(Math.random()*5));$('skill').onclick=()=>hit(S.atk+10+Math.floor(Math.random()*7));$('heal').onclick=()=>{if(S.herb>0){S.herb--;log('薬草を使った。');save()}else toast('薬草がない！')};$('next').onclick=spawn;$('auto').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;render()}else{autoTimer=setInterval(()=>{if(!busy)hit(S.atk+Math.floor(Math.random()*7))},520);render()}};$('ten').onclick=async()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null}let target=S.battles+10;while(S.battles<target){if(!busy)hit(S.atk+8);await new Promise(r=>setTimeout(r,260))}};function open(type){let h='';if(type==='shop')h=`<h2>💰 ショップ</h2><div class="row"><div><b>鉄の剣</b><br><span class="small">攻撃力 +6</span></div><button class="buy" onclick="buySword()">500G</button></div><div class="row"><div><b>旅人の服</b><br><span class="small">防御力 +8</span></div><button class="buy">400G</button></div><div class="row"><div><b>幸運の指輪</b><br><span class="small">レア掘り用</span></div><button class="buy">1200G</button></div>`;if(type==='party')h=`<h2>⚔️ パーティ</h2><div class="row"><b>のり Lv${S.lv}</b><span>${S.weapon} / 攻撃 ${S.atk}</span></div><div class="row"><b>ミア</b><span>魔法使い</span></div><div class="row"><b>モフ</b><span>サポート</span></div>`;if(type==='bag')h=`<h2>🎒 持ち物</h2><div class="row"><b>薬草</b><span>× ${S.herb}</span></div><div class="row"><b>青い指輪</b><span>× ${S.rare}</span></div>`;if(type==='book')h=`<h2>📖 モンスター図鑑</h2><div class="row"><b>001 スライム</b><span>討伐 ${S.kills}</span></div><div class="row"><b>仲間</b><span>${S.slimeFriend?'獲得済':'？？？'}</span></div><div class="row"><b>黄金スライム</b><span>${S.goldSlime?'獲得済':'？？？'}</span></div>`;$('panel').innerHTML=h+'<button class="close" onclick="closeModal()">閉じる</button>';$('modal').classList.add('show')}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));window.closeModal=()=>$('modal').classList.remove('show');window.buySword=()=>{if(S.gold<500)return toast('ゴールドが足りない');if(S.weapon==='鉄の剣')return toast('すでに装備中');S.gold-=500;S.atk+=6;S.weapon='鉄の剣';save();toast('鉄の剣を装備した！');open('shop')};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};render()})();
</script></body></html>
