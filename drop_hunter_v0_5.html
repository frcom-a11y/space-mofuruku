<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071426">
<title>DROP HUNTER v0.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#071426;--panel:#0d2037;--line:#496581;--gold:#e5c65c;--green:#63dc79;--red:#f05b67;--blue:#3277c7}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;color:inherit}
#app{height:100dvh;max-width:760px;margin:auto;background:var(--navy);display:grid;grid-template-rows:auto auto 1fr auto auto;overflow:hidden;padding-top:env(safe-area-inset-top)}
.top{height:56px;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:900}
.logo{color:#f1d46a;font-size:20px}.stats{display:flex;gap:18px;font-size:18px}
.stage{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:900;font-size:19px}
.battle{min-height:0;margin:0 12px;border:3px solid var(--gold);border-radius:15px;overflow:hidden;position:relative;background:linear-gradient(#55b5e8 0 47%,#a6e767 47% 69%,#54aa3e 69%);display:grid;grid-template-rows:1fr 92px}
.cloud{position:absolute;top:7%;left:10%;width:95px;height:24px;border-radius:30px;background:#eefaff}.cloud:after{content:"";position:absolute;width:80px;height:25px;left:35px;top:10px;border-radius:30px;background:#eefaff}
.enemies{display:flex;align-items:end;justify-content:space-around;padding:36px 8px 8px;gap:4px}
.enemy{width:31%;text-align:center;position:relative}.enemy.dead{opacity:.2}.enemy.selected{filter:drop-shadow(0 0 8px #ffe75c)}
.einfo{background:#071426;border:2px solid #506b85;border-radius:9px;padding:4px;font-size:11px;font-weight:900}.selected .einfo{border-color:#ffe75c}
.hpbar{height:6px;background:#24374d;margin-top:4px}.hpfill{height:100%;background:var(--red)}
.sprite{height:66px;margin:5px auto 0;display:flex;align-items:center;justify-content:center;font-size:48px;transition:.12s}.hit{transform:scale(.82)}
.target{height:15px;font-size:10px;color:#ffe77b;font-weight:900}
.partySprites{display:flex;align-items:end;justify-content:space-around;padding:0 18px 8px;font-size:43px}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 12px 5px}
.card{background:#0b1b2f;border:2px solid #415e7c;border-radius:9px;padding:5px 7px;font-size:11px;font-weight:800}
.card .bar{height:6px;background:#26384d;margin-top:4px}.card .bar i{display:block;height:100%;background:var(--green)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:3px 12px 7px}
.btn{border:2px solid #587493;border-radius:10px;background:#213958;min-height:43px;font-weight:900;font-size:14px}
.btn.attack{background:#a63f3d}.btn.magic{background:#2866aa}.btn.auto.on{background:#3b7847}.btn:active{transform:scale(.97)}
.bottom{height:58px;border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);background:#020b18}
.nav{border:0;background:transparent;font-size:11px}.nav b{display:block;font-size:23px;margin-bottom:1px}
.overlay{display:none;position:fixed;inset:0;background:#071426;z-index:20;max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);overflow:auto}
.overlay.open{display:block}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:10px}.close{background:#243b59;border:1px solid #66809b;border-radius:8px;padding:8px 13px}
.panel{background:#0d2037;border:1px solid #405e7a;border-radius:12px;padding:12px;margin-top:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #29445e;padding:10px 0}.row:last-child{border:0}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.skill{background:#153458;border:1px solid #5b7895;border-radius:10px;padding:12px;text-align:left}.skill small{display:block;color:#b8c9db;margin-top:4px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 13px;border-radius:20px;font-size:12px;z-index:40;display:none}
@media(max-height:700px){.top{height:48px}.stage{height:40px}.battle{grid-template-rows:1fr 76px}.sprite{height:52px;font-size:39px}.partySprites{font-size:35px}.party{padding-top:4px}.btn{min-height:37px}.bottom{height:50px}}
</style>
</head>
<body>
<main id="app">
 <header class="top"><div class="logo">⚔ DROP HUNTER <small>v0.5</small></div><div class="stats"><span>Lv <b id="lv">1</b></span><span>💰 <b id="gold">500</b>G</span></div></header>
 <div class="stage"><span>はじまりの草原 1</span><span><b id="battleNo">1</b>戦目</span></div>
 <section class="battle">
  <div class="cloud"></div>
  <div class="enemies" id="enemies"></div>
  <div class="partySprites"><span>⚔️</span><span>🧙‍♀️</span><span>🐱</span></div>
 </section>
 <section>
  <div class="party">
   <div class="card">のり <span id="hp1t">60/60</span><div class="bar"><i id="hp1"></i></div></div>
   <div class="card">ミア <span id="hp2t">42/42</span><div class="bar"><i id="hp2"></i></div></div>
   <div class="card">モフ <span id="hp3t">50/50</span><div class="bar"><i id="hp3"></i></div></div>
  </div>
  <div class="actions">
   <button class="btn attack" id="attack">⚔ 攻撃</button>
   <button class="btn magic" id="skills">✨ 技・呪文</button>
   <button class="btn" id="heal">🌿 薬草</button>
   <button class="btn auto" id="auto">AUTO OFF</button>
   <button class="btn" id="ten">▶ 10戦</button>
   <button class="btn" id="next">次の敵</button>
  </div>
 </section>
 <nav class="bottom">
  <button class="nav" data-page="party"><b>⚔️</b>パーティ</button>
  <button class="nav" data-page="shop"><b>💰</b>ショップ</button>
  <button class="nav" data-page="items"><b>🎒</b>持ち物</button>
  <button class="nav" data-page="book"><b>📖</b>図鑑</button>
 </nav>
</main>
<div class="overlay" id="overlay"><div class="head"><h2 id="otitle">メニュー</h2><button class="close" id="close">閉じる</button></div><div id="obody"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s), saveKey="dropHunter05";
let state={lv:1,gold:500,battle:1,xp:0,herb:5,auto:false,hp:[60,42,50],max:[60,42,50],kills:{スライム:0,ゴブリン:0,オオカミ:0},items:["木の剣","旅人の服","小さなお守り"]};
try{const s=JSON.parse(localStorage.getItem(saveKey));if(s)state={...state,...s}}catch(e){}
let enemies=[],target=0,timer=null;
const types=[["スライム","💧",22,8],["ゴブリン","👺",30,11],["オオカミ","🐺",26,10]];
function persist(){localStorage.setItem(saveKey,JSON.stringify(state))}
function spawn(){
 enemies=[]; let n=1+Math.floor(Math.random()*3);
 for(let i=0;i<n;i++){let t=types[Math.floor(Math.random()*types.length)];let max=t[2]+state.lv*3;enemies.push({name:t[0],icon:t[1],hp:max,max,atk:t[3]})}
 target=0; while(target<enemies.length&&enemies[target].hp<=0)target++; render();
}
function render(){
 $("#lv").textContent=state.lv;$("#gold").textContent=state.gold;$("#battleNo").textContent=state.battle;
 $("#auto").textContent=state.auto?"AUTO ON":"AUTO OFF";$("#auto").classList.toggle("on",state.auto);
 $("#enemies").innerHTML=enemies.map((e,i)=>`<div class="enemy ${e.hp<=0?"dead":""} ${i===target?"selected":""}" data-i="${i}"><div class="einfo">${e.name} Lv${state.lv}<div class="hpbar"><div class="hpfill" style="width:${Math.max(0,e.hp/e.max*100)}%"></div></div></div><div class="sprite">${e.icon}</div><div class="target">${i===target&&e.hp>0?"▲ TARGET":""}</div></div>`).join("");
 enemies.forEach((e,i)=>{let el=$(`.enemy[data-i="${i}"]`);if(el)el.onclick=()=>{if(e.hp>0){target=i;render()}}});
 state.hp.forEach((h,i)=>{$("#hp"+(i+1)).style.width=(h/state.max[i]*100)+"%";$("#hp"+(i+1)+"t").textContent=h+"/"+state.max[i]});
 persist();
}
function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(x._t);x._t=setTimeout(()=>x.style.display="none",1200)}
function living(){return enemies.filter(e=>e.hp>0)}
function hit(i,d){if(!enemies[i]||enemies[i].hp<=0)return;enemies[i].hp=Math.max(0,enemies[i].hp-d)}
function enemyTurn(){living().forEach(e=>{let i=Math.floor(Math.random()*3);state.hp[i]=Math.max(1,state.hp[i]-Math.max(1,e.atk-Math.floor(Math.random()*5)))})}
function after(){
 if(living().length===0){enemies.forEach(e=>state.kills[e.name]=(state.kills[e.name]||0)+1);let gain=12+Math.floor(Math.random()*15);state.gold+=gain;state.xp+=10;toast(`勝利！ +${gain}G`);
 if(state.xp>=state.lv*50){state.xp=0;state.lv++;state.max=state.max.map(x=>x+5);state.hp=[...state.max];toast(`LEVEL UP！ Lv${state.lv}`)}
 state.battle++;setTimeout(spawn,450);return}
 target=enemies.findIndex((e,i)=>i>=target&&e.hp>0);if(target<0)target=enemies.findIndex(e=>e.hp>0);enemyTurn();render()
}
$("#attack").onclick=()=>{hit(target,12+Math.floor(Math.random()*8)+state.lv*2);after()};
$("#heal").onclick=()=>{if(state.herb<=0)return toast("薬草がない");state.herb--;state.hp[0]=Math.min(state.max[0],state.hp[0]+30);toast("のりのHPが回復した");render()};
$("#next").onclick=()=>{state.battle++;spawn()};
$("#skills").onclick=()=>open("技・呪文",`<div class="skillgrid"><button class="skill" data-s="fire"><b>🔥 火炎斬り</b><small>単体 / 威力 大</small></button><button class="skill" data-s="wind"><b>🌪 風刃</b><small>敵全体 / 威力 中</small></button><button class="skill" data-s="heal"><b>✨ ヒール</b><small>味方単体 / 回復</small></button><button class="skill" disabled><b>???</b><small>Lv5で習得</small></button></div>`,true);
$("#auto").onclick=()=>{state.auto=!state.auto;render();clearInterval(timer);if(state.auto)timer=setInterval(()=>{if(state.auto){hit(target,14+state.lv*2);after()}},700)};
$("#ten").onclick=()=>{let c=0;clearInterval(timer);state.auto=true;render();timer=setInterval(()=>{if(c++>=10){clearInterval(timer);state.auto=false;render();return}let ls=living();ls.forEach(e=>e.hp=0);after()},350)};
function open(title,body,skills=false){$("#otitle").textContent=title;$("#obody").innerHTML=body;$("#overlay").classList.add("open");if(skills)document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{let s=b.dataset.s;$("#overlay").classList.remove("open");if(s==="fire")hit(target,28+state.lv*3);if(s==="wind")enemies.forEach((e,i)=>hit(i,16+state.lv*2));if(s==="heal"){state.hp[0]=Math.min(state.max[0],state.hp[0]+25);render();return}after()})}
$("#close").onclick=()=>$("#overlay").classList.remove("open");
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{
 let p=b.dataset.page;
 if(p==="party")open("パーティ",`<div class="panel"><div class="row"><b>のり Lv${state.lv}</b><span>⚔ 木の剣</span></div><div class="row"><b>ミア</b><span>🪄 見習いの杖</span></div><div class="row"><b>モフ</b><span>🐾 仲間モンスター</span></div><p class="small">装備枠：武器 / 服 / アクセサリー</p></div>`);
 if(p==="shop")open("ショップ",`<div class="panel"><div class="row"><span>鉄の剣</span><button onclick="alert('次版で購入機能を拡張')">300G</button></div><div class="row"><span>革の服</span><span>220G</span></div><div class="row"><span>幸運のお守り</span><span>800G</span></div></div>`);
 if(p==="items")open("持ち物",`<div class="panel"><div class="row"><span>🌿 薬草</span><b>${state.herb}個</b></div>${state.items.map(x=>`<div class="row"><span>${x}</span><span>所持</span></div>`).join("")}</div>`);
 if(p==="book")open("図鑑",`<div class="panel">${Object.entries(state.kills).map(([k,v])=>`<div class="row"><span>${v?k:"???"}</span><b>${v}体</b></div>`).join("")}<div class="row"><span>突然変異</span><b>???</b></div></div>`);
});
spawn();
})();
</script>
</body></html>
