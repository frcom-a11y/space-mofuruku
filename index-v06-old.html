<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071426"><title>DROP HUNTER v0.6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#020817;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button{font:inherit;color:inherit}
:root{--gold:#f1ce63;--nav:#071426;--panel:#0d2038;--line:#496887;--red:#ef5b67;--green:#64d978;--mp:#55a8ef}
#app{height:100dvh;max-width:760px;margin:auto;background:var(--nav);display:grid;grid-template-rows:58px 45px 1fr 58px 102px 58px;overflow:hidden;padding-top:env(safe-area-inset-top)}
.top,.stage{display:flex;align-items:center;justify-content:space-between;padding:0 13px}.top{border-bottom:2px solid var(--gold);font-weight:900}.logo{color:var(--gold);font-size:18px}.stage{font-weight:900}
.expMini{font-size:10px;min-width:115px}.expbar,.hpbar,.mpbar{background:#25364b;overflow:hidden}.expbar{height:6px;border-radius:5px;margin-top:3px}.expbar i,.hpbar i,.mpbar i{display:block;height:100%}.expbar i{background:#e9ca55}
.battle{position:relative;min-height:0;margin:0 10px;border:3px solid var(--gold);border-radius:13px;overflow:hidden;background:linear-gradient(#55b8e8 0 48%,#b3e76d 48% 68%,#50a53b 68%)}.sun{position:absolute;right:8%;top:7%;width:34px;height:34px;border-radius:50%;background:#fff3a6}.cloud{position:absolute;left:7%;top:10%;width:82px;height:20px;border-radius:20px;background:#eefaff}
.enemies{position:absolute;inset:20% 3% 32%;display:flex;align-items:flex-end;justify-content:space-around;gap:4px}.enemy{width:31%;text-align:center}.enemy.selected{filter:drop-shadow(0 0 7px #ffe46d)}.enemy.dead{opacity:.2}.einfo{background:#071426;border:2px solid #58728d;border-radius:8px;padding:3px;font-size:10px;font-weight:900}.selected .einfo{border-color:#ffe46d}.hpbar{height:6px;margin-top:3px}.hpbar i{background:var(--red)}.sprite{font-size:54px;line-height:1;height:64px;display:flex;align-items:end;justify-content:center}.target{height:14px;color:#ffe676;font-size:9px;font-weight:900}
.heroes{position:absolute;left:7%;right:7%;bottom:4%;display:flex;justify-content:space-around;align-items:end}.hero{text-align:center}.hero .pix{font-size:42px;filter:drop-shadow(0 4px 0 #0005)}.hero small{display:block;background:#071426cc;border-radius:6px;padding:2px 5px;font-weight:800}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 10px}.pcard{background:#0b1c31;border:1px solid #45637f;border-radius:8px;padding:4px 6px;font-size:10px;font-weight:800}.bars{display:grid;gap:2px;margin-top:3px}.hpbar,.mpbar{height:5px}.mpbar i{background:var(--mp)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 10px 6px}.btn{border:2px solid #587593;border-radius:9px;background:#213a5a;font-weight:900;font-size:13px;min-height:43px}.atk{background:#a94140}.magic{background:#315fa4}.auto.on{background:#3c7c4b}.btn:active{transform:scale(.97)}
.bottom{border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);background:#020b18}.nav{border:0;background:none;font-size:9px}.nav b{display:block;font-size:20px}
.overlay{display:none;position:fixed;inset:0;z-index:30;max-width:760px;margin:auto;background:#071426;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);overflow:auto}.overlay.open{display:block}.head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold)}.close{padding:8px 12px;background:#203a58;border:1px solid #65809b;border-radius:8px}.panel{margin-top:12px;background:#0d2038;border:1px solid #496887;border-radius:11px;padding:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px solid #29465f}.row:last-child{border:0}.buy{background:#315f91;border:1px solid #7190aa;border-radius:7px;padding:6px 9px}.locked{opacity:.45}.skills{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.skill{background:#153658;border:1px solid #587895;border-radius:9px;padding:11px;text-align:left}.skill small{display:block;color:#b9cad9;margin-top:3px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:45;background:#000d;border:1px solid #8aa1b5;border-radius:18px;padding:7px 12px;font-size:11px;display:none}
.levelFx{display:none;position:fixed;inset:0;z-index:60;background:#061328e8;align-items:center;justify-content:center;text-align:center}.levelFx.show{display:flex;animation:flash .35s}.levelCard{width:min(86%,420px);border:3px solid var(--gold);border-radius:18px;padding:28px 18px;background:radial-gradient(circle,#274c79,#09182c 70%);box-shadow:0 0 40px #ffe16c88}.levelCard h1{margin:0;color:#ffe16c;font-size:34px;animation:pop .55s}.spark{font-size:25px;letter-spacing:9px}.newskill{color:#8fe9ff;font-weight:900;margin-top:12px}.small{font-size:11px;color:#bdd0df}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes flash{0%{background:#fff}100%{background:#061328e8}}
@media(max-height:720px){#app{grid-template-rows:50px 38px 1fr 52px 88px 50px}.sprite{font-size:44px;height:51px}.hero .pix{font-size:34px}.btn{min-height:36px}.logo{font-size:16px}}
</style></head><body>
<main id="app">
<header class="top"><div class="logo">⚔ DROP HUNTER <small>v0.6</small></div><div class="expMini"><div>Lv <b id="lv">1</b>　EXP <span id="expTxt">0 / 120</span></div><div class="expbar"><i id="expFill"></i></div></div><div>💰 <b id="gold">500</b>G</div></header>
<div class="stage"><span>はじまりの草原 1</span><span><b id="battleNo">1</b>戦目</span></div>
<section class="battle"><div class="sun"></div><div class="cloud"></div><div class="enemies" id="enemies"></div><div class="heroes"><div class="hero"><div class="pix">🧑🏻‍🦱⚔️</div><small>のり</small></div><div class="hero"><div class="pix">🧙🏻‍♀️</div><small>ミア</small></div><div class="hero"><div class="pix">🐱✨</div><small>モフ</small></div></div></section>
<div class="party" id="party"></div>
<div class="actions"><button class="btn atk" id="attack">⚔ 攻撃</button><button class="btn magic" id="skills">✨ 技・呪文</button><button class="btn" id="guard">🛡 防御</button><button class="btn auto" id="auto">AUTO OFF</button><button class="btn" id="ten">▶ 10戦</button><button class="btn" id="herb">🌿 薬草</button></div>
<nav class="bottom"><button class="nav" data-page="stage"><b>🗺️</b>ステージ</button><button class="nav" data-page="party"><b>⚔️</b>パーティ</button><button class="nav" data-page="shop"><b>🏪</b>ショップ</button><button class="nav" data-page="items"><b>🎒</b>持ち物</button><button class="nav" data-page="book"><b>📖</b>図鑑</button></nav>
</main>
<div class="overlay" id="overlay"><div class="head"><h2 id="otitle"></h2><button class="close" id="close">閉じる</button></div><div id="obody"></div></div>
<div class="toast" id="toast"></div>
<div class="levelFx" id="levelFx"><div class="levelCard"><div class="spark">✦ ✧ ✦</div><h1>LEVEL UP!</h1><h2 id="levelLine"></h2><div id="growth"></div><div class="newskill" id="newSkill"></div><p class="small">タップして続ける</p></div></div>
<script>
(()=>{"use strict";const $=s=>document.querySelector(s),KEY="dropHunter06";
const needExp=l=>Math.floor(100+20*l+15*l*l);
const learn={2:"強撃",3:"火炎斬り",5:"ヒール",7:"風刃",10:"二連斬り",12:"アイス",15:"会心斬り",20:"奥義・紅蓮"};
let S={lv:1,exp:0,gold:500,battle:1,herb:5,auto:false,hp:[70,52,60],max:[70,52,60],mp:[18,30,22],mpmax:[18,30,22],guard:false,kills:{スライム:0,ゴブリン:0,オオカミ:0},owned:["木の剣","旅人の服","小さなお守り"]};
try{let x=JSON.parse(localStorage.getItem(KEY));if(x)S={...S,...x}}catch(e){}
let E=[],target=0,timer=null;
const mons=[["スライム","💧",30,8,14],["ゴブリン","👺",42,11,19],["オオカミ","🐺",36,10,17]];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function spawn(){E=[];let n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){let m=mons[Math.floor(Math.random()*mons.length)],mx=m[2]+S.lv*4;E.push({name:m[0],icon:m[1],hp:mx,max:mx,atk:m[3]+S.lv,xp:m[4]+S.lv*2,charge:false})}target=0;render()}
function render(){let req=needExp(S.lv);$("#lv").textContent=S.lv;$("#gold").textContent=S.gold;$("#battleNo").textContent=S.battle;$("#expTxt").textContent=`${S.exp} / ${req}`;$("#expFill").style.width=(S.exp/req*100)+"%";$("#auto").textContent=S.auto?"AUTO ON":"AUTO OFF";$("#auto").classList.toggle("on",S.auto);
$("#enemies").innerHTML=E.map((e,i)=>`<div class="enemy ${e.hp<=0?"dead":""} ${i===target?"selected":""}" data-i="${i}"><div class="einfo">${e.charge?"⚠️ ":""}${e.name} Lv${S.lv}<div class="hpbar"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div></div><div class="sprite">${e.icon}</div><div class="target">${i===target&&e.hp>0?"▲ TARGET":""}</div></div>`).join("");document.querySelectorAll(".enemy").forEach(el=>el.onclick=()=>{let i=+el.dataset.i;if(E[i].hp>0){target=i;render()}});
$("#party").innerHTML=["のり","ミア","モフ"].map((n,i)=>`<div class="pcard">${n} HP ${S.hp[i]}/${S.max[i]}<div class="bars"><div class="hpbar"><i style="width:${S.hp[i]/S.max[i]*100}%"></i></div><div class="mpbar"><i style="width:${S.mp[i]/S.mpmax[i]*100}%"></i></div></div>MP ${S.mp[i]}/${S.mpmax[i]}</div>`).join("");save()}
function living(){return E.filter(e=>e.hp>0)}function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";clearTimeout(x._t);x._t=setTimeout(()=>x.style.display="none",1300)}
function hit(i,d){if(E[i]&&E[i].hp>0)E[i].hp=Math.max(0,E[i].hp-d)}
function enemyTurn(){living().forEach(e=>{if(e.charge){let i=Math.floor(Math.random()*3),d=e.atk*2;S.hp[i]=Math.max(1,S.hp[i]-Math.max(1,S.guard?Math.floor(d*.35):d));e.charge=false;toast(`${e.name}の強攻撃！`)}else if(Math.random()<.18){e.charge=true;toast(`⚠️ ${e.name}が力を溜めている！`)}else{let i=Math.floor(Math.random()*3),d=e.atk;S.hp[i]=Math.max(1,S.hp[i]-Math.max(1,S.guard?Math.floor(d*.35):d))}});S.guard=false}
function addExp(x){S.exp+=x;let req=needExp(S.lv);if(S.exp>=req){S.exp-=req;let old=S.lv;S.lv++;S.max=S.max.map((v,i)=>v+[6,4,5][i]);S.mpmax=S.mpmax.map((v,i)=>v+[2,3,2][i]);S.hp=[...S.max];S.mp=[...S.mpmax];$("#levelLine").textContent=`Lv.${old} → Lv.${S.lv}`;$("#growth").innerHTML="HP・MP・能力値がアップ！";$("#newSkill").textContent=learn[S.lv]?`NEW SKILL! 「${learn[S.lv]}」を覚えた！`:"";$("#levelFx").classList.add("show")}}
function finish(){if(living().length)return false;let xp=E.reduce((a,e)=>a+e.xp,0),g=8+E.length*7+Math.floor(Math.random()*10);E.forEach(e=>S.kills[e.name]=(S.kills[e.name]||0)+1);S.gold+=g;toast(`勝利！ EXP +${xp} / +${g}G`);addExp(xp);S.battle++;setTimeout(spawn,500);return true}
function end(){if(finish())return;target=E.findIndex(e=>e.hp>0);enemyTurn();render()}
$("#levelFx").onclick=()=>{$("#levelFx").classList.remove("show");render()};
$("#attack").onclick=()=>{hit(target,13+S.lv*2+Math.floor(Math.random()*7));end()};
$("#guard").onclick=()=>{S.guard=true;toast("防御の構え！");enemyTurn();render()};
$("#herb").onclick=()=>{if(!S.herb)return toast("薬草がない");S.herb--;S.hp[0]=Math.min(S.max[0],S.hp[0]+35);toast("HP +35");render()};
$("#skills").onclick=()=>{let skills=[["強撃",2,"単体 / MP3"],["火炎斬り",3,"単体 / MP5"],["ヒール",5,"回復 / MP5"],["風刃",7,"全体 / MP8"],["二連斬り",10,"単体2回 / MP8"]];open("技・呪文",`<div class="skills">${skills.map(([n,l,d])=>`<button class="skill ${S.lv<l?"locked":""}" data-sk="${n}" ${S.lv<l?"disabled":""}><b>${S.lv<l?"🔒 ":""}${n}</b><small>${d}　Lv${l}習得</small></button>`).join("")}</div>`);document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>useSkill(b.dataset.sk))};
function useSkill(n){$("#overlay").classList.remove("open");let cost={強撃:3,火炎斬り:5,ヒール:5,風刃:8,二連斬り:8}[n];if(S.mp[0]<cost)return toast("MPが足りない");S.mp[0]-=cost;if(n==="強撃")hit(target,24+S.lv*3);if(n==="火炎斬り")hit(target,32+S.lv*3);if(n==="ヒール"){S.hp[0]=Math.min(S.max[0],S.hp[0]+45);render();return}if(n==="風刃")E.forEach((e,i)=>hit(i,18+S.lv*2));if(n==="二連斬り"){hit(target,18+S.lv*2);hit(target,18+S.lv*2)}end()}
$("#auto").onclick=()=>{S.auto=!S.auto;render();clearInterval(timer);if(S.auto)timer=setInterval(()=>{if(S.auto){hit(target,14+S.lv*2);end()}},800)};
$("#ten").onclick=()=>{toast("10戦AUTO開始");let c=0;clearInterval(timer);S.auto=true;render();timer=setInterval(()=>{if(c>=10){clearInterval(timer);S.auto=false;render();return}if(living().length){E.forEach(e=>e.hp=0);finish();c++}},650)};
function open(t,b){$("#otitle").textContent=t;$("#obody").innerHTML=b;$("#overlay").classList.add("open")}$("#close").onclick=()=>$("#overlay").classList.remove("open");
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{let p=b.dataset.page;
if(p==="stage")open("ステージ",`<div class="panel"><div class="row"><b>草原1</b><span>挑戦中</span></div><div class="row locked"><b>草原2</b><span>Lv3で解放</span></div><div class="row locked"><b>草原ボス</b><span>???</span></div></div>`);
if(p==="party")open("パーティ",`<div class="panel"><div class="row"><b>のり Lv${S.lv}</b><span>木の剣 / 旅人の服 / お守り</span></div><div class="row"><b>ミア</b><span>見習いの杖</span></div><div class="row"><b>モフ</b><span>仲間モンスター</span></div></div>`);
if(p==="shop"){let goods=[["銅の剣",1,180],["鉄の剣",3,420],["革の服",4,360],["幸運のお守り",6,800],["炎の剣",10,1800],["魔力の指輪",12,2400]];open("ショップ",`<div class="panel">${goods.map(([n,l,g])=>`<div class="row ${S.lv<l?"locked":""}"><span><b>${S.lv<l?"🔒 ":""}${n}</b><br><small>Lv${l}で解放</small></span><button class="buy" ${S.lv<l?"disabled":""}>${g}G</button></div>`).join("")}</div>`)};
if(p==="items")open("持ち物",`<div class="panel"><div class="row"><span>🌿 薬草</span><b>${S.herb}個</b></div>${S.owned.map(x=>`<div class="row"><span>${x}</span><span>所持</span></div>`).join("")}</div>`);
if(p==="book")open("図鑑",`<div class="panel">${Object.entries(S.kills).map(([n,k])=>`<div class="row"><span>${k?n:"???"}</span><b>${k}体</b></div>`).join("")}<div class="row"><span>突然変異</span><b>???</b></div></div>`)});
spawn();render()})();
</script></body></html>
